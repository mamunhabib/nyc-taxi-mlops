  restartPolicy: Always
  containers:
    - name: streamer
      image: python:3.11-slim
      imagePullPolicy: IfNotPresent
      command: ["python", "-u", "/app/streamer.py"]
      env:
        - name: SERVING_ENDPOINT
          value: "http://nyc-taxi-serving:8000/predict"
        - name: STREAM_DELAY
          value: "0.5"
        - name: DATA_FILE
          value: "/app/q2_samples.json"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      volumeMounts:
        - name: config-volume
          mountPath: /app
  volumes:
    - name: config-volume
      configMap:
        name: nyc-taxi-streamer-config
