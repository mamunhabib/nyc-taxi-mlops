  streamer.py: |
    import os
    import sys
    import time
    import json
    import signal
    import itertools
    import urllib.request
    import urllib.error
    
    ENDPOINT = os.getenv("SERVING_ENDPOINT", "http://nyc-taxi-serving:8000/predict")
    DELAY = float(os.getenv("STREAM_DELAY", "0.5"))
    DATA_FILE = os.getenv("DATA_FILE", "/app/q2_samples.json")
    
    print("=" * 65)
    print("NYC TAXI CONTINUOUS TRAFFIC GENERATOR POD")
    print(f"Target Serving Service:  {ENDPOINT}")
    print(f"Inter-arrival Delay:     {DELAY}s (~{1/DELAY:.1f} req/s)")
    print(f"Dataset Source:          {DATA_FILE}")
    print("=" * 65)
    
    # Wait for serving service to be reachable
    print(f"[Streamer] Probing endpoint connection to {ENDPOINT}...")
    connected = False
    for attempt in range(1, 30):
        try:
            health_url = ENDPOINT.replace("/predict", "/health")
            with urllib.request.urlopen(health_url, timeout=2.0) as resp:
                if resp.status == 200:
                    print(f"[Streamer] Serving backend is healthy and responding! Proceeding...")
                    connected = True
                    break
        except Exception as e:
            print(f"[Streamer] Waiting for serving service (attempt {attempt}/30): {e}")
            time.sleep(2)
    
    with open(DATA_FILE, "r") as f:
        data = json.load(f)
    
    months = list(data.keys())
    print(f"Loaded {len(months)} production months: {months}")
    for m in months:
        print(f"  - {m}: {len(data[m])} genuine Green Taxi records")
    
    running = True
    def handle_sig(sig, frame):
        global running
        print(f"[Streamer] Signal {sig} received. Gracefully stopping stream...")
        running = False
    
    signal.signal(signal.SIGINT, handle_sig)
    signal.signal(signal.SIGTERM, handle_sig)
    
    total_sent = 0
    total_success = 0
    total_errors = 0
    start_time = time.time()
    
    for cycle, month_name in enumerate(itertools.cycle(months), start=1):
        if not running:
            break
        trips = data[month_name]
        print(f"\n>>> [Cycle #{cycle}] Starting production batch: {month_name} ({len(trips)} rides)")
    
        for i, (pu, do, dist) in enumerate(trips, start=1):
            if not running:
                break
            payload = json.dumps({
                "PULocationID": int(pu),
                "DOLocationID": int(do),
                "trip_distance": float(dist)
            }).encode("utf-8")
            req = urllib.request.Request(ENDPOINT, data=payload, headers={"Content-Type": "application/json"})
    
            try:
                with urllib.request.urlopen(req, timeout=3.0) as resp:
                    if resp.status == 200:
                        total_success += 1
                    else:
                        total_errors += 1
            except Exception as e:
                total_errors += 1
    
            total_sent += 1
    
            if total_sent % 25 == 0:
                elapsed = time.time() - start_time
                rps = total_sent / elapsed if elapsed > 0 else 0
                print(
                    f"[Telemetry] Sent: {total_sent:5d} | OK: {total_success:5d} | Err: {total_errors:3d} | "
                    f"Rate: {rps:.1f} req/s | Current: {month_name} ({i}/{len(trips)}) PU={pu} DO={do} dist={dist}mi"
                )
    
            if DELAY > 0:
                time.sleep(DELAY)
    
    print(f"\n[Streamer] Stream completed. Total Sent: {total_sent} (Success: {total_success}, Errors: {total_errors})")
    
